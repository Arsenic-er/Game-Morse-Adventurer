name: Windows portable

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.12.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync pinned cwformer semantic model
        run: pnpm semantic:model:sync

      - name: Run automated tests
        run: pnpm test

      - name: Gate poor-channel scenarios on ONNX Runtime
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "poor-qso-report.json"
          $env:CWGAME_SCENARIO_OUTPUT = $reportPath
          pnpm qso:simulate:poor
          if ($LASTEXITCODE -ne 0) {
            throw "Poor-channel semantic scenario gate failed"
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.provider -ne "onnxruntime-node") {
            throw "Poor-channel gate used '$($report.provider)' instead of onnxruntime-node"
          }
          if (!$report.releaseReady -or $report.passed -ne $report.total) {
            throw "Poor-channel gate did not pass every scenario"
          }
          "Poor-channel model gate: $($report.passed)/$($report.total) via $($report.provider)." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Gate NPC calibration on ONNX Runtime
        shell: pwsh
        run: |
          $lines = @(pnpm qso:calibrate 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Output $_ }
          $output = $lines -join "`n"
          if ($exitCode -ne 0) {
            throw "NPC reception calibration gate failed"
          }
          if ($output -notmatch '"provider"\s*:\s*"onnxruntime-node"') {
            throw "NPC calibration did not use onnxruntime-node"
          }
          if ($output -notmatch '"releaseReady"\s*:\s*true') {
            throw "NPC calibration did not reach its release threshold"
          }
          "NPC reception calibration passed through the ONNX provider." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Build portable executable
        run: pnpm run desktop:build

      - name: Verify build-size report
        shell: pwsh
        run: |
          $reportPath = "dist/build-size-report.json"
          if (!(Test-Path -LiteralPath $reportPath)) {
            throw "Build did not produce build-size-report.json"
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if (!$report.passed -or $report.largestOwnedJsChunk.bytes -gt 512000) {
            $report | ConvertTo-Json -Depth 5
            throw "Owned JavaScript chunk budget exceeded 500 KiB"
          }

      - name: Smoke-test packaged semantic model
        shell: pwsh
        run: |
          $semanticOutput = Join-Path $env:RUNNER_TEMP "cwgame-semantic-smoke.json"
          $env:CWGAME_SEMANTIC_SMOKE_OUTPUT = $semanticOutput
          $process = Start-Process `
            -FilePath "release/CWGame-latest.exe" `
            -ArgumentList "--semantic-smoke" `
            -WindowStyle Hidden `
            -PassThru `
            -Wait
          Remove-Item Env:CWGAME_SEMANTIC_SMOKE_OUTPUT -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $semanticOutput)) {
            throw "Packaged semantic smoke failed with exit code $($process.ExitCode)"
          }
          $report = Get-Content -LiteralPath $semanticOutput -Raw | ConvertFrom-Json
          if (!$report.ok -or $report.provider -ne "onnxruntime-node") {
            $report | ConvertTo-Json -Depth 5
            throw "Packaged executable did not load the pinned ONNX model"
          }
          "Packaged semantic model: $($report.modelVersion) via $($report.provider)." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Smoke-test packaged game
        shell: pwsh
        run: |
          $qaOutput = Join-Path $env:RUNNER_TEMP "cwgame-qa"
          $exe = (Resolve-Path "release/CWGame-latest.exe").Path
          node scripts/run-packaged-qa.cjs --exe $exe --output $qaOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Segmented packaged CWGame QA failed with exit code $LASTEXITCODE"
          }

          $resultPath = Join-Path $qaOutput "qa-result.json"
          if (!(Test-Path -LiteralPath $resultPath)) {
            throw "Packaged QA did not produce qa-result.json"
          }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.totalPhysicalCaptures -ne 91 -or @($result.captures).Count -ne 91) {
            $result | ConvertTo-Json -Depth 5
            throw "Packaged QA manifest did not name exactly 91 physical screenshots"
          }
          foreach ($relativeCapture in $result.captures) {
            $capturePath = Join-Path $qaOutput $relativeCapture
            if (!(Test-Path -LiteralPath $capturePath) -or (Get-Item -LiteralPath $capturePath).Length -eq 0) {
              throw "Packaged QA manifest screenshot is missing or empty: $relativeCapture"
            }
          }

          $lightsResultPath = Join-Path $qaOutput $result.lightsResult
          $lightsResult = Get-Content -LiteralPath $lightsResultPath -Raw | ConvertFrom-Json
          node -e "const fs = require('fs'); const { validateLightsQaEvidence } = require('./electron/qa-capture.cjs'); validateLightsQaEvidence(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')));" $lightsResultPath
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged Lights QA result failed its literal gameplay fact/schema validation"
          }
          $requiredLightsCheckpoints = @(
            "story-ready", "keying-probe", "story-launch", "chase-complete", "control-entered",
            "escape-paused", "escape-resumed", "failed-run", "retry-control",
            "settled", "reloaded-history", "duplicate-settlement"
          )
          foreach ($checkpoint in $requiredLightsCheckpoints) {
            if ($null -eq $lightsResult.checkpoints.PSObject.Properties[$checkpoint]) {
              throw "Packaged Lights QA result is missing checkpoint '$checkpoint'"
            }
          }
          $consoleLog = Join-Path $qaOutput "runtime-console-errors.json"
          if (!(Test-Path -LiteralPath $consoleLog)) {
            throw "Packaged QA did not produce the runtime console report"
          }
          $consoleErrors = @(Get-Content -LiteralPath $consoleLog -Raw | ConvertFrom-Json)
          if ($consoleErrors.Count -gt 0) {
            $consoleErrors | ConvertTo-Json -Depth 5
            throw "Packaged QA recorded renderer warnings or errors"
          }

          "Packaged QA captured 91 exact segmented screens and all Lights gameplay checkpoints." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Verify executable and write checksum
        shell: pwsh
        run: |
          $path = Resolve-Path "release/CWGame-latest.exe"
          $file = Get-Item -LiteralPath $path
          if ($file.Length -lt 50MB) {
            throw "Portable executable is unexpectedly small: $($file.Length) bytes"
          }

          $stream = [System.IO.File]::OpenRead($path)
          try {
            $first = $stream.ReadByte()
            $second = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($first -ne 0x4D -or $second -ne 0x5A) {
            throw "Portable artifact does not have a Windows PE MZ header"
          }

          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          "$hash  CWGame-latest.exe" | Set-Content -LiteralPath "release/CWGame-latest.sha256" -Encoding ascii
          @"
          ## Windows portable artifact

          - Commit: ``${{ github.sha }}``
          - Size: ``$($file.Length) bytes``
          - SHA-256: ``$hash``
          - Signing: unsigned prototype build
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CWGame-Windows-x64-portable
          path: |
            release/CWGame-latest.exe
            release/CWGame-latest.sha256
            dist/build-size-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CWGame-Windows-QA-failure
          path: ${{ runner.temp }}/cwgame-qa
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish durable tagged release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download exact portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CWGame-Windows-x64-portable
          path: downloaded-artifact

      - name: Generate and verify release checksum
        id: verify
        shell: pwsh
        run: |
          $exeFiles = @(Get-ChildItem -LiteralPath "downloaded-artifact" -Recurse -File -Filter "CWGame-latest.exe")
          $shaFiles = @(Get-ChildItem -LiteralPath "downloaded-artifact" -Recurse -File -Filter "CWGame-latest.sha256")
          if ($exeFiles.Count -ne 1 -or $shaFiles.Count -ne 1) {
            throw "Downloaded artifact must contain exactly one portable EXE and one SHA-256 file"
          }
          $exe = $exeFiles[0].FullName
          $shaFile = $shaFiles[0].FullName
          $actualHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          $recordedHash = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          if ($recordedHash -ne $actualHash) {
            throw "Downloaded portable checksum mismatch"
          }
          "$actualHash  CWGame-latest.exe" | Set-Content -LiteralPath $shaFile -Encoding ascii
          "exe=$exe" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "sha=$shaFile" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Publish durable tag release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXE: ${{ steps.verify.outputs.exe }}
          RELEASE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = Join-Path $env:RUNNER_TEMP "CWGame-release-notes.md"
          @"
          ## CWGame Windows portable

          This is an **unsigned prototype build**. Windows may display an Unknown Publisher or SmartScreen warning. Verify the attached SHA-256 file before running it.

          The repository is **source-available for review under a proprietary license**. No open-source license is granted for the original game code or artwork. Third-party components retain their own licenses.

          - Commit: ``${{ github.sha }}``
          - Platform: Windows x64 portable
          - Attachments: ``CWGame-latest.exe`` and ``CWGame-latest.sha256``
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_EXE $env:RELEASE_SHA --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit $tag --title "CWGame $tag" --notes-file $notes --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag `
              $env:RELEASE_EXE `
              $env:RELEASE_SHA `
              --verify-tag `
              --title "CWGame $tag" `
              --notes-file $notes `
              --repo "$env:GITHUB_REPOSITORY"
          }

