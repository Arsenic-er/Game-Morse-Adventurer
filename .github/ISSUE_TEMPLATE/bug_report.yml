name: Bug report
description: Report a gameplay, CW input, audio, or save problem in the desktop game.
title: '[Bug]: '
body:
- type: dropdown
  id: component
  attributes:
    label: Affected component
    options:
    - Chapter or mission progression
    - CW input or audio
    - QSO semantic understanding
    - Save or load
    - Interface or localization
    - Desktop packaging
    - Other / unsure
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Version or commit SHA
  validations:
    required: true
- type: textarea
  id: summary
  attributes:
    label: What happened?
    placeholder: 'Example: A mission objective does not update after a completed CW
      exchange.'
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: '1. Open the affected chapter and mission.

      2. Complete the exchange described below.

      3. Check the objective, then save and reload.'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    placeholder: The objective and saved progress should reflect the completed exchange.
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Chapter and game state
    placeholder: 'Chapter, mission, or scene:

      Current objective:

      Input method:

      New game or existing save:

      Last action before the problem:'
- type: textarea
  id: environment
  attributes:
    label: Environment
    placeholder: 'Operating system:

      Game build or release:

      Display resolution and scaling:

      Audio device (if relevant):'
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs, screenshots, or a minimal example
    description: Include the smallest example or log excerpt needed to reproduce the
      problem.
